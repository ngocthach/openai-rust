[package]
name = "openai-compat"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Async Rust client for OpenAI-compatible LLM provider APIs"
readme = "README.md"
rust-version = "1.86"
repository = "https://github.com/ngocthach/openai-rust"
keywords = ["openai", "llm", "ai", "chatgpt", "client"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "examples/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["time", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
thiserror = "2"
bytes = "1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-test = "0.4"
wiremock = "0.6"
